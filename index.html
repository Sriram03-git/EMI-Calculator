<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loan Calculator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e7490'/%3E%3Cpath d='M9 22l5-6 4 3 6-8' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{--bg:#f2f5f7;--card:#fff;--text:#10222b;--muted:#5b6b75;--bd:#dbe3e8;--acc:#0e7490;--accfg:#fff;--inp:#f6f9fa;--g:#15803d;--gbg:#dcfce7;--r:#b91c1c;--rbg:#fee2e2;--a:#b45309;--abg:#fef3c7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1419;--card:#101d25;--text:#e6edf1;--muted:#91a4af;--bd:#223540;--acc:#22d3ee;--accfg:#04222a;--inp:#0b161c;--g:#4ade80;--gbg:#06301a;--r:#f87171;--rbg:#3f0d0d;--a:#fbbf24;--abg:#3b2506}}
:root[data-theme="dark"]{--bg:#0a1419;--card:#101d25;--text:#e6edf1;--muted:#91a4af;--bd:#223540;--acc:#22d3ee;--accfg:#04222a;--inp:#0b161c;--g:#4ade80;--gbg:#06301a;--r:#f87171;--rbg:#3f0d0d;--a:#fbbf24;--abg:#3b2506}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font-family:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:30}
.card{background:var(--card);border:1px solid var(--bd);border-radius:1rem;padding:1rem}
.lbl{font-size:.78rem;font-weight:600;color:var(--muted);display:block;margin-bottom:.3rem}
.inp{width:100%;background:var(--inp);color:var(--text);border:1px solid var(--bd);border-radius:.6rem;padding:.6rem .7rem;font:inherit;font-size:16px}
.inp:focus,.btn:focus-visible,.btn2:focus-visible,.nv:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn,.btn2{border-radius:.7rem;padding:.7rem 1.6rem;font:inherit;font-weight:700;min-height:46px;cursor:pointer}
.btn{background:var(--acc);color:var(--accfg);border:1px solid var(--acc)}
.btn2{background:transparent;color:var(--text);border:1px solid var(--bd)}
.btn2:hover{border-color:var(--acc)}
/* navigation: top scroll bar on phones, sidebar on desktop */
.side{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--bd);align-self:start}
.top{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.55rem .75rem 0}
.sbt.dsk{display:none}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.05rem;white-space:nowrap}
.sbt{display:grid;place-items:center;flex:none;width:2.25rem;height:2.25rem;border:1px solid var(--bd);border-radius:.6rem;background:var(--inp);color:var(--muted);cursor:pointer}
.sbt:hover{color:var(--text);border-color:var(--acc)}
.sbt:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sbt svg{transition:transform .2s}
.nf{display:none}
#nav{display:flex;gap:.35rem;overflow-x:auto;padding:.5rem .75rem}
.nv{flex:none;display:flex;align-items:center;gap:.6rem;padding:.5rem .8rem;border-radius:.7rem;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:.9rem;cursor:pointer;text-align:left;min-height:44px;white-space:nowrap}
.nv small{display:none;font-weight:500;font-size:.72rem;opacity:.85}
.nv:hover{background:var(--inp);color:var(--text)}
.nv[aria-current="page"]{background:var(--acc);color:var(--accfg)}
.sep{flex:none;width:1px;background:var(--bd);margin:.4rem .2rem}
.sep span{display:none}
/* sidebar from 960px up (covers desktops, laptops and the ~980px "Desktop site" mode on phones) */
@media(min-width:960px){
.side{top:0;height:100vh;overflow:hidden auto;border-bottom:0;border-right:1px solid var(--bd);padding:1.4rem .9rem}
.top{display:flex}
.top{padding:0}
.sbt.dsk{display:grid}
#nav{flex-direction:column;overflow:visible;padding:0;margin-top:1.4rem}
.nv{width:100%;white-space:normal}.nv small{display:block}
.nf{display:inline}.ns{display:none}
.sep{width:auto;height:auto;background:none;margin:.9rem .5rem .25rem;font-size:.72rem;font-weight:700;color:var(--muted)}.sep span{display:block}
.shell{display:grid;grid-template-columns:16rem minmax(0,1fr);transition:grid-template-columns .2s ease}
.shell.collapsed{grid-template-columns:4.75rem minmax(0,1fr)}
.collapsed .side{padding:1.4rem .55rem}
.collapsed .top{flex-direction:column;gap:.9rem}
.collapsed .tools{flex-direction:column}
.collapsed .sbt svg{transform:rotate(180deg)}
.collapsed .bt,.collapsed .nv>span,.collapsed .sep span{display:none}
.collapsed .nv{justify-content:center;padding:.65rem}
.collapsed .sep{height:1px;background:var(--bd);margin:.7rem .4rem .3rem}
}
#views,.res{scroll-margin-top:7.5rem}
@media(min-width:960px){#views,.res{scroll-margin-top:4.5rem}}
.kpi .val{font-size:1.35rem;font-weight:700;margin-top:.35rem}
.kpi .sub{font-size:.78rem;color:var(--muted);margin-top:.15rem}
.bar{display:flex;height:.8rem;border-radius:999px;overflow:hidden;background:var(--a);margin:.8rem 0 .5rem}.bar i{background:var(--acc)}
.adv{border-radius:1rem;padding:1rem;border:1px solid}
.adv.g{background:var(--gbg);border-color:var(--g)}.adv.g .t{color:var(--g)}
.adv.r{background:var(--rbg);border-color:var(--r)}.adv.r .t{color:var(--r)}
.adv.a{background:var(--abg);border-color:var(--a)}.adv.a .t{color:var(--a)}
.tw{max-height:26rem;overflow:auto;border:1px solid var(--bd);border-radius:.75rem;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:.85rem;white-space:nowrap;font-variant-numeric:tabular-nums}
th,td{padding:.6rem .85rem;text-align:right;border-bottom:1px solid var(--bd)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0}
th{position:sticky;top:0;background:var(--inp);color:var(--muted);font-size:.75rem;font-weight:600;z-index:2}
th:first-child{z-index:3}
td:first-child{background:var(--card);font-weight:600}
th.set{color:var(--acc)}
td.set{background:color-mix(in srgb,var(--acc) 9%,var(--card));font-weight:700}
tfoot td{font-weight:700;background:var(--inp);position:sticky;bottom:0}
.tw .best td{background:var(--gbg)}
.bdg{display:inline-flex;align-items:center;gap:.35rem;font-size:.75rem;font-weight:600;padding:.15rem .6rem;border-radius:999px}
.bdg.g{background:var(--gbg);color:var(--g)}.bdg.a{background:var(--abg);color:var(--a)}.bdg.r{background:var(--rbg);color:var(--r)}
.sw{position:relative;flex:none;width:3rem;height:1.75rem}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--muted);transition:background .15s}
.sw i::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.35rem;height:1.35rem;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.sw input:checked+i{background:var(--acc)}
.sw input:checked+i::after{transform:translateX(1.25rem)}
.sw input:focus-visible+i{outline:2px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.sw i,.sw i::after,.shell,.sbt svg{transition:none}}
.lnk{color:var(--acc);font:inherit;font-size:.78rem;font-weight:700;background:none;border:0;padding:.25rem;cursor:pointer;text-decoration:underline}
/* rupee inputs + manual */
.use{background:color-mix(in srgb,var(--acc) 8%,var(--card));border:1px solid color-mix(in srgb,var(--acc) 35%,var(--bd));border-radius:.8rem;padding:.8rem .9rem;margin-top:.5rem}
.use h4{font-weight:700;font-size:.85rem;color:var(--acc);margin-bottom:.35rem}
.cw{position:relative}
.rs{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700;pointer-events:none}
.cw .inp{padding-left:1.8rem}
.fm{background:var(--inp);border:1px solid var(--bd);border-radius:.6rem;padding:.5rem .75rem;font-size:.85rem;overflow-x:auto;white-space:nowrap;margin:.4rem 0}
/* interest-rate info: header button + popup */
.tools{display:flex;align-items:center;gap:.4rem}
.ibtn{color:var(--acc)}
.rt{background:color-mix(in srgb,var(--acc) 8%,var(--card));border:1px solid color-mix(in srgb,var(--acc) 35%,var(--bd));border-radius:.8rem;padding:.7rem .8rem}
.mdl{position:fixed;inset:0;z-index:60;display:flex;justify-content:center;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 4.5rem) 1rem 1rem;opacity:0;visibility:hidden;transition:opacity .25s ease,visibility 0s linear .25s}
.mdl.open{opacity:1;visibility:visible;transition:opacity .25s ease,visibility 0s}
.mdl-bg{position:absolute;inset:0;background:rgba(6,16,22,.5);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.mdl-card{position:relative;width:min(26rem,100%);overflow:hidden;background:var(--card);color:var(--text);border:1px solid var(--bd);border-top:3px solid var(--acc);border-radius:1rem;padding:1rem 1rem 1.3rem;box-shadow:0 18px 50px rgba(0,0,0,.35);transform:translateY(-10px) scale(.98);transition:transform .25s ease}
.mdl.open .mdl-card{transform:none}
.mdl-b{max-height:calc(100vh - 9rem);overflow:auto}
.mdl-x{position:absolute;top:.6rem;right:.6rem;z-index:1}
.mdl-t{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--bd)}
.mdl-t i{display:block;height:100%;background:var(--acc);transform-origin:left}
.mdl-t i.run{animation:imt 10s linear forwards}
@keyframes imt{to{transform:scaleX(0)}}
@media(prefers-reduced-motion:reduce){.mdl,.mdl.open,.mdl-card{transition:none}.mdl-t{display:none}}
.seg{display:flex;flex-wrap:wrap;gap:.4rem}.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.seg span{display:block;padding:.6rem .9rem;min-height:44px;border:1px solid var(--bd);border-radius:.6rem;background:var(--inp);color:var(--text);font-weight:600;font-size:.9rem}
.seg input:checked+span{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.seg input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
/* yearly optimizer: year-wise amount fields + quick fill */
.yq{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.6rem}
.qf{min-height:44px;padding:.45rem .8rem;border:1px solid var(--bd);border-radius:.6rem;background:var(--inp);color:var(--text);font:inherit;font-weight:600;font-size:.85rem;cursor:pointer}
.qf:hover{border-color:var(--acc)}
.qf:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.yyg{display:grid;grid-template-columns:minmax(0,1fr);gap:.75rem;max-height:28rem;overflow:auto;padding:.25rem}
.yb{background:color-mix(in srgb,var(--acc) 5%,var(--card));border:1px solid var(--bd);border-radius:.8rem;padding:.7rem .75rem}
.ybh{font-size:.9rem;margin-bottom:.5rem}.ybh small{color:var(--muted);font-weight:500;font-size:.75rem}
.yb>.yo{margin:-.3rem 0 .5rem}
.ysg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
.yyg .lbl small{font-weight:500;font-size:.72rem}
.adv ul{margin-top:.5rem}
.yf.off .lbl,.yf.off .cw,.ys.off .lbl,.ys.off .cw{opacity:.45}
.yo{display:block;font-size:.72rem;color:var(--muted);margin-top:.25rem}
.yo:empty{display:none}
.yyn{display:flex;gap:.5rem;align-items:flex-start;padding:.6rem .8rem;border:1px solid var(--a);border-radius:.6rem;background:var(--abg);color:var(--text);font-size:.85rem;line-height:1.35}
.yyn svg{margin-top:.1rem;color:var(--a)}
.yyn:empty{display:none}
.inp:disabled{cursor:not-allowed}
</style>
</head>
<body>
<div id="shell" class="shell min-h-screen">
  <aside class="side">
    <div class="top"><div class="brand"><span class="rounded-xl p-2" style="background:var(--acc);color:var(--accfg)"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg></span><span class="bt">Loan Calculator</span></div><div class="tools"><button type="button" id="ib" class="sbt ibtn" aria-haspopup="dialog" aria-controls="im" aria-label="Show interest rate info" title="Interest rate info"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></button><button type="button" id="sbt" class="sbt dsk" aria-controls="nav" aria-expanded="true" aria-label="Collapse sidebar" title="Collapse sidebar"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button></div></div>
    <nav id="nav" aria-label="Calculation views"></nav>
  </aside>
  <main class="w-full max-w-5xl mx-auto p-4 pb-10 space-y-4">
    <template id="tpl-form"><form id="f" class="card" style="border-top:3px solid var(--acc)" novalidate>
      <h3 class="font-bold text-lg">Loan details</h3>
      <p class="text-sm mb-3" style="color:var(--muted)">These details feed every calculation. Change them here only.</p>
      <div id="main" class="grid grid-cols-2 lg:grid-cols-4 gap-3"></div>
      <div class="flex gap-3 mt-4">
        <button id="go" type="submit" class="btn flex-1 sm:flex-none">Calculate</button>
        <button id="reset" type="button" class="btn2 flex-1 sm:flex-none">Reset</button>
      </div>
      <p id="err" role="alert" class="text-sm font-semibold mt-3" style="color:var(--r)"></p>
    </form></template>
    <div id="views" class="space-y-4"></div>
      <p class="text-xs" style="color:var(--muted)">These are estimates. The interest rate is worked out from your loan amount, EMI and tenure (monthly compounding). Part-payment assumes no extra charge, and pre-close assumes foreclosure is allowed after the stated number of EMIs. Please confirm all figures with your loan agreement.</p>
  </main>
</div>

<div id="im" class="mdl" aria-hidden="true">
  <div class="mdl-bg" id="im-bg"></div>
  <div class="mdl-card" role="dialog" aria-modal="true" aria-labelledby="im-h">
    <button type="button" id="im-x" class="sbt mdl-x" aria-label="Close interest rate info" title="Close"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <div class="mdl-b" id="im-body"></div>
    <div class="mdl-t" aria-hidden="true"><i id="im-bar"></i></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const inr2=n=>'₹'+n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const sn=n=>(n<0?'−':'')+inr(Math.abs(n));
const P_={cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18m-12 6 2 2 4-4"/>',
layers:'<path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/>',
check:'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
alert:'<path d="m10.3 3.9-8.5 14.7A2 2 0 0 0 3.5 21.5h17a2 2 0 0 0 1.7-2.9L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
rupee:'<path d="M6 3h12M6 8h12M6 13l8.5 8M6 13h3c6.7 0 6.7-10 0-10"/>',
trend:'<path d="m22 17-8.5-8.5-5 5L2 7"/><path d="M16 17h6v-6"/>',
pct:'<path d="M19 5 5 19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>',
spark:'<path d="M12 3l2.4 5.6L20 11l-5.6 2.4L12 19l-2.4-5.6L4 11l5.6-2.4z"/>',
repeat:'<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
date:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 15h3"/>',
info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>'};
const ic=(n,c='w-5 h-5')=>`<svg class="${c} shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P_[n]}</svg>`;
const DOT='<svg class="w-2 h-2" viewBox="0 0 8 8" aria-hidden="true"><circle cx="4" cy="4" r="4" fill="currentColor"/></svg>';
const gIN=d=>d.length>3?d.slice(0,-3).replace(/\B(?=(\d{2})+(?!\d))/g,',')+','+d.slice(-3):d;
const fc_=s=>{s=String(s).replace(/[^\d.]/g,'');const d=s.indexOf('.');if(d>=0)s=s.slice(0,d+1)+s.slice(d+1).replace(/\./g,'').slice(0,2);return gIN((d>=0?s.slice(0,d):s).replace(/^0+(?=\d)/,''))+(d>=0?s.slice(d):'')};
const cfld=(id,l,d)=>`<div><label class="lbl" for="${id}">${l}</label><div class="cw"><span class="rs" aria-hidden="true">₹</span><input id="${id}" class="inp" type="text" inputmode="decimal" autocomplete="off" data-cur value="${fc_(d)}" placeholder="Enter amount"></div></div>`;
const fld=(id,l,d)=>`<div><label class="lbl" for="${id}">${l}</label><input id="${id}" class="inp" type="number" inputmode="decimal" min="0" step="any" value="${d}" placeholder="Enter value"></div>`;

/* ---- views ---- */
/* switches shown inside the Pre-Close settings card: add the monthly / yearly part-payments to the pre-close maths */
const tgl=(id,t,s)=>`<div><label class="flex items-center justify-between gap-3 cursor-pointer"><b class="text-sm" id="${id}-t">${t}</b><span class="sw"><input type="checkbox" role="switch" id="${id}"><i></i></span></label><small class="block text-xs mt-1" id="${id}-s" style="color:var(--muted)">${s}</small></div>`;
const PRE_OPT=`<div class="col-span-2 space-y-3 pt-3" style="border-top:1px solid var(--bd)"><span class="lbl" style="margin:0">Add your part-payments to this calculation</span>${tgl('pim','Include Monthly Partly Payment (₹X extra every month)','Adds the extra amount from Partly Payment to every EMI, from month 1.')}${tgl('piy','Include Yearly Part-Payment (Year-wise custom amounts)','Adds the payments typed in Yearly Optimizer, each in its own month.')}</div>`;
const seg=(nm,l,o,d)=>`<div class="col-span-2"><span class="lbl">${l}</span><div class="seg" role="radiogroup" aria-label="${l}">${o.map(([x,t])=>`<label><input type="radio" name="${nm}" value="${x}"${x===d?' checked':''}><span>${t}</span></label>`).join('')}</div></div>`;
const V=[
 {id:'normal',l:'Normal Calculation',s:'Normal',sub:'Loan summary and schedule',i:'rupee',d:'Enter your loan details here. Every other view uses them. See what you pay with only your regular EMI.'},
 {id:'pre',l:'Pre-Close Calculation',s:'Pre-Close',sub:'Close the loan early',i:'cal',d:'Find the best month to pay off the whole loan in one go. You can also include your monthly and yearly part-payments.',f:fld('fc','Closing charge (%)',4.7)+fld('lock','Allowed after (months)',3)+PRE_OPT},
 {id:'part',l:'Partly Payment Calculation',s:'Partly Payment',sub:'Pay extra every month',i:'layers',d:'See how much sooner you finish if you add extra to every EMI.',f:cfld('extra','Extra every month',5000)},

let cur='normal',ST=null;

function solve(P,E,n){if(E*n<=P)return NaN;let lo=1e-9,hi=1;for(let i=0;i<200;i++){const m=(lo+hi)/2;E*(1-Math.pow(1+m,-n))/m>P?lo=m:hi=m}return(lo+hi)/2}
function sched(P,r,pay,n){const R=[];let b=P;for(let m=1;b>.005&&m<=1200;m++){const i=b*r;let p=pay-i,paid=pay;if(p>=b-.005||(n&&m===n)){p=b;paid=b+i}const c=Math.max(0,b-p);R.push({m,paid,i,p,c,sp:P-c});b=c}return R}
const sum=(a,k)=>a.reduce((s,x)=>s+x[k],0);
function preRows(S,stdPaid,f,L){const o=[];let cum=0,ci=0;S.forEach(x=>{cum+=x.paid;ci+=x.i;if(x.m>=Math.max(1,L)&&x.c>.5){const fee=x.c*f/100,lump=x.c+fee,rem=stdPaid-cum;o.push({m:x.m,b:x.c,sp:x.sp,fee,lump,gross:rem-x.c,net:rem-lump,cum,ci})}});return o}
const dur=m=>[Math.floor(m/12)?Math.floor(m/12)+(m>=24?' years':' year'):'',m%12?m%12+(m%12>1?' months':' month'):''].filter(Boolean).join(' ')||'0 months';
function rng(a){const o=[];let s=a[0],p=a[0];for(let i=1;i<=a.length;i++){const c=a[i];if(c!==p+1){o.push(s===p?''+s:s+'–'+p);s=c}p=c}return 'Month '+o.join(', ')}

  `<tfoot><tr>${td(['Total',inr(sum(A,'paid')),inr(sum(A,'i')),inr(sum(A,'p')),'',''])}</tr></tfoot>`,5);
const SET='“Settled amount” is the part of the loan you have repaid so far.';

/* ---- duration-wise interest & principal paid (shown below every schedule) ---- */
const DW={},DWV={};
function dwHtml(k){
  const A=DW[k],s=DWV[k],num=x=>{const n=Math.floor(Number(x));return isFinite(n)&&n>0?n:0},
    d=num(s.d),m=num(s.m),y=num(s.y);
  if(!A||(!d&&!m&&!y))return '';
  const L=A.length,fm=y*12+m,full=fm>=L,k2=Math.min(fm,L);let ti=0,tp=0;
  for(let j=0;j<k2;j++){ti+=A[j].i;tp+=A[j].p+(A[j].ex||0)}
  if(d&&!full){const r=A[fm];ti+=r.i/30*d;tp+=(r.p+(r.ex||0))/30*d}
  const lab=[fm?dur(fm):'',d?d+(d>1?' days':' day'):''].filter(Boolean).join(' '),
    nt=fm>L?`Your duration is longer than the loan, so the totals are capped at the full ${L}-month schedule.`:(full&&d?`The loan ends after ${L} months, so the extra days are not added.`:'');
  return `<div class="grid grid-cols-2 gap-3">`+kpi('trend','Total Interest Paid',inr2(ti),`in ${lab}`)+kpi('rupee','Total Principal Paid',inr2(tp),`in ${lab}`)+`</div>`+(nt?`<p class="text-xs" style="color:var(--muted)">${nt}</p>`:'');
}
function dwise(k,A){
  DW[k]=A;const s=DWV[k]||(DWV[k]={d:'',m:'',y:''});
  const f=(c,l)=>`<div><label class="lbl" for="dw-${k}-${c}">${l}</label><input id="dw-${k}-${c}" class="inp dw-in" data-k="${k}" data-f="${c}" type="number" inputmode="numeric" min="0" step="1" placeholder="0" value="${s[c]}"></div>`;
  return `<div class="card space-y-3"><div><h3 class="font-semibold text-lg">Duration-wise Interest &amp; Principal Paid</h3><p class="text-xs" style="color:var(--muted)">Counted from month 1 of the schedule above. Enter days, months, years or a mix (for example 1 year and 6 months).</p></div><div class="grid grid-cols-3 gap-3 sm:max-w-md">${f('d','Day')}${f('m','Month')}${f('y','Year')}</div><div id="dw-o-${k}" class="space-y-2" aria-live="polite">${dwHtml(k)}</div></div>`;
}
document.addEventListener('input',e=>{const t=e.target;if(!t.classList||!t.classList.contains('dw-in'))return;const k=t.dataset.k;DWV[k][t.dataset.f]=/^\d+$/.test(t.value)?t.value:'';$('dw-o-'+k).innerHTML=dwHtml(k)});
document.addEventListener('keydown',e=>{const t=e.target;if(t.classList&&t.classList.contains('dw-in')&&['e','E','+','-','.',','].includes(e.key))e.preventDefault()});

/* ---- view 1: normal ---- */
function vNormal(){
  const {P,E,n,r,S,paid,int,base}=ST,rb=base>0?solve(base,E,n):NaN,ok=isFinite(rb)&&base>0,pi=int/paid*100;
  return `<div class="card"><div class="lbl" style="margin:0">You will pay in total</div><div class="text-3xl font-extrabold mt-1">${inr(paid)}</div>
    <div class="bar" role="img" aria-label="${(100-pi).toFixed(0)}% loan, ${pi.toFixed(0)}% interest"><i style="width:${100-pi}%"></i></div>
    <div class="flex flex-wrap gap-x-5 gap-y-1 text-sm"><span class="flex items-center gap-2"><svg class="w-3 h-3" viewBox="0 0 8 8" style="color:var(--acc)" aria-hidden="true"><circle cx="4" cy="4" r="4" fill="currentColor"/></svg>Loan ${inr(P)}</span><span class="flex items-center gap-2"><svg class="w-3 h-3" viewBox="0 0 8 8" style="color:var(--a)" aria-hidden="true"><circle cx="4" cy="4" r="4" fill="currentColor"/></svg>Interest ${inr(int)}</span></div></div>`+
    `<div class="grid grid-cols-2 lg:grid-cols-3 gap-3">`+
    kpi('rupee','Monthly EMI',inr(E),`for ${n} months`)+
    kpi('trend','Total interest',inr(int),`${pi.toFixed(1)}% of what you pay`)+
    kpi('pct','Yearly interest rate',(r*1200).toFixed(2)+'%','on the reducing balance')+`</div>`+
    (ok?note(`On the ${inr(base)} you actually received, the real cost is about ${(rb*1200).toFixed(1)}% a year`+(P>base?` because ${inr(P-base)} of charges were added to the loan.`:'.')):'')+
    head('Month-by-month schedule',`How each EMI is split between interest and principal. ${SET}`)+stable(S,'EMI')+dwise('normal',S);
}

/* ---- view 2: pre-close ---- */
/* pre-close rows when the monthly extra (X) and / or the yearly part-payments (Q) are paid from month 1 up to the closing month */
function preRowsL(f,L,X,Q){
  const fq=Q?Q.fq:1,ch=Q?Q.ch:0,xs=Q?Q.xs:Array.from({length:yrN()},()=>[0]),p=yrSim(xs,fq,ch,X),o=[],si=ST.int;
  let cp=0,cm=0,ce=0,cf=0,ci=0;
  p.A.forEach(x=>{
    cp+=x.pay;cm+=x.mx;ce+=x.ex;cf+=x.fee;ci+=x.i;
    if(x.m>=Math.max(1,L)&&x.c>.5){const fee=x.c*f/100,gross=si-ci;
      o.push({m:x.m,b:x.c,sp:x.sp,fee,lump:x.c+fee,gross,net:gross-cf-fee,cum:cp+cm+ce+cf,ci,cm,ce,cf,ex:cm+ce})}
  });
  return{rows:o,p};
}
function vPre(){
  const {n,S,paid}=ST,f=v('fc'),L=Math.round(v('lock'));
  if([f,L].some(x=>!isFinite(x)||x<0))return msg('Please enter valid, positive numbers.');
  const uM=$('pim').checked,uY=$('piy').checked,lk=uM||uY,wn=[];
  let rows,X=0,Q=null,pl=null;
  if(!lk)rows=preRows(S,paid,f,L);
  else{
    if(uM){
      X=v('extra');
      if(!isFinite(X)||X<0)return msg('Please enter a valid, positive extra amount in Partly Payment, or switch off the monthly option here.');
      if(!(X>0))wn.push('Monthly Partly Payment is switched on, but no extra amount is set. Enter one in Partly Payment.');
    }
    if(uY){
      Q=yrInputs();
      if(Q.err)return msg(`Yearly Part-Payment: ${Q.err} Fix it in Yearly Optimizer, or switch off the yearly option here.`);
      if(!Q.xs.some(r=>r.some(x=>x>0)))wn.push('Yearly Part-Payment is switched on, but no payment amounts are entered. Add them in Yearly Optimizer.');
    }
    const o=preRowsL(f,L,X,Q);rows=o.rows;pl=o.p;
    const h=Q&&Q.bad.find(b=>slotMo(b.y,b.j,Q.fq)<=pl.len);
    if(h)return msg(`Yearly Part-Payment: please enter a valid amount for Year ${h.y} - Payment ${h.j+1} in Yearly Optimizer.`);
  }
  const W=wn.map(t=>note(t)).join('');
  if(!rows.length)return W+note(lk?`You cannot pre-close: with your part-payments the loan ends in ${pl.len} months, before closing is allowed (after ${Math.max(1,L)} EMIs).`:'You cannot pre-close: the loan ends before closing is allowed.');
  const mx=Math.max(...rows.map(x=>x.net));
  rows.forEach(x=>x.z=(mx<=0||x.net<=0||x.net<.1*mx)?'r':x.net>=.5*mx?'g':'a');
  const best=rows.find(x=>x.net===mx),G=rows.filter(x=>x.z=='g'),B=rows.filter(x=>x.z=='r'),be=rows.find(x=>x.net<=0),lab={g:'Recommended',a:'Fair',r:'Not worth it'};
  /* what is actually added on top of the EMIs (only options that have an amount) */
  const mOn=uM&&X>0,yOn=!!Q&&Q.xs.some(r=>r.some(x=>x>0)),inc=[mOn?`${inr(X)} extra every month`:'',yOn?`your year-wise part-payments (${Q.fq} time${s_(Q.fq)} a year)`:''].filter(Boolean),
    cx=inc.length>0,cc=yOn&&Q.ch>0;
  const kx=cx?g3(
      kpi('layers','Extra paid before closing',inr(best.ex),[mOn?`${inr(best.cm)} monthly`:'',yOn?`${inr(best.ce)} yearly`:''].filter(Boolean).join(' + ')),
      kpi('rupee','Total you pay in all',inr(best.cum+best.lump),`instead of ${inr(paid)} on the regular plan`),
      kpi('alert','Total charges',inr(best.cf+best.fee),`${inr(best.fee)} closing + ${inr(best.cf)} part-payment`)):'';
  const hd=['Month','Balance left','Settled amount'].concat(cx?['Part-payments paid']:[],cc?['Part-pay charge']:[],[`Charge (${f}%)`,'Pay to close','Interest saved','You save','Verdict']);
  return W+g3(kpi('cal','Best month to close','Month '+best.m,`after paying ${best.m} EMIs`),
      kpi('rupee','Amount to pay that month',inr(best.lump),`${inr(best.b)} balance + ${inr(best.fee)} charge`),
      kpi('trend','Interest you save',sn(best.net),lk?'after all charges':'after the closing charge'))+kx+
    `<div class="grid md:grid-cols-2 gap-3">`+
    adv('g','check','Good months to close',G.length?rng(G.map(x=>x.m)):'None',
      `Closing in month ${best.m} saves the most: ${sn(best.net)} compared with ${lk?`your regular loan (all ${n} EMIs, no part-payments)`:`paying all ${n} EMIs`}.`,'The earlier you close, the more interest you avoid.')+
    adv('r','alert','Not worth it',B.length?rng(B.map(x=>x.m)):'None',
      B.length?`From month ${B[0].m}, the ${f}% charge is about as much as the interest left to pay.`+(be?` After month ${be.m} the charge is higher than the remaining interest.`:''):'Closing early saves money in every allowed month.',
      'In these months, keep paying your regular EMI.')+`</div>`+
    head('Pre-close schedule',`You can close after ${Math.max(1,L)} EMIs.${cx?` Every month up to the closing month includes ${lst(inc)}.`:''} “You save” is the interest avoided${lk?' compared with your regular loan':''} minus ${lk?'all charges':'the closing charge'}. ${SET}`)+
    tbl(hd,
      rows.map(x=>`<tr class="${x===best?'best':''}">`+td([x.m,inr(x.b),inr(x.sp)].concat(cx?[inr(x.ex)]:[],cc?[inr(x.cf)]:[],[inr(x.fee),inr(x.lump),inr(x.gross),sn(x.net),`<span class="bdg ${x.z}">${DOT}${lab[x.z]}</span>`]),2)+`</tr>`).join(''),'',2)+
    dwise('pre',lk?pl.A:S);

/* ---- view 3: partly payment ---- */
function vPart(){
  const {P,E,n,r,int:si}=ST,X=v('extra');
  if(!isFinite(X)||X<0)return msg('Please enter a valid, positive amount.');
  if(!(X>0))return note('Enter an extra monthly amount above to see how much sooner you finish.');
  const A=sched(P,r,E+X,0),nt=A.length,sv=n-nt,ia=sum(A,'i');
  return g3(kpi('clock','New loan length',nt+' months',`instead of ${n} months`),
      kpi('cal','Time saved',sv+' months',`${(sv/12).toFixed(1)} years sooner`),
      kpi('trend','Interest you save',inr(si-ia),`${inr(si)} down to ${inr(ia)}`))+
    head('Your new schedule',`Every month you pay ${inr(E)} EMI + ${inr(X)} extra, starting from month 1. ${SET}`)+stable(A,'You pay')+dwise('part',A);
}

/* ---- view 4: custom year ---- */
function vCust(){
  const {P,E,n,r,int:si}=ST,cy=v('cy'),cm=v('cm');
  if([cy,cm].some(x=>!isFinite(x)||x<0))return msg('Please enter valid, positive numbers.');
  const tm=cy*12+cm,T=Math.round(tm);
  if(!(tm>0))return note('Enter years and months above (for example 1 year and 6 months).');
  if(T<1)return msg('The target must be at least 1 month.');
  if(T>=n)return adv('a','info','No extra payment needed',`${dur(T)} is not shorter than ${dur(n)}`,`Your regular EMI already ends the loan in ${n} months.`,'Enter a shorter target to see the extra amount you need.');
  const M=r>1e-12?P*r/(1-Math.pow(1+r,-T)):P/T,x=M-E,A=sched(P,r,M,T),ia=sum(A,'i');
  return g3(kpi('rupee','Extra needed every month',inr2(x),`${inr2(M)} in total (${inr(E)} EMI + extra)`),
      kpi('clock','Loan ends in',dur(T),`${n-T} months sooner than ${n}`),
      kpi('trend','Interest you save',inr(si-ia),`${inr(si)} down to ${inr(ia)}`))+
    head(`Schedule to finish in ${dur(T)}`,`Pay ${inr2(x)} extra with every EMI from month 1. Rounding up to ${inr(Math.ceil(x))} also finishes on time. ${SET}`)+stable(A,'You pay')+dwise('cust',A);
}

/* ---- view 5: special (renders only when opened) ---- */
function vSpec(){
  const {P,E,n,r,S,paid:stdPaid,int:stdInt}=ST,f=v('fc'),L=Math.round(v('lock'));let X=v('extra'),auto=false;
  if([f,L,X].some(x=>!isFinite(x)||x<0))return msg('Please enter valid numbers in the Pre-Close and Partly Payment views first.');
  if(!(X>0)){X=Math.max(100,Math.round(E/200)*100);auto=true}
  const rows=preRows(S,stdPaid,f,L),mx=rows.length?Math.max(...rows.map(x=>x.net)):0,best=mx>0?rows.find(x=>x.net===mx):null;
  const A=sched(P,r,E+X,0),nt=A.length,ia=sum(A,'i'),ppPaid=sum(A,'paid'),pp=stdInt-ia,pc=best?best.net:0,win=!!best&&pc>pp,diff=Math.abs(pc-pp);
  const D='—',B=!!best,no=rows.length?'No saving after the charge':'Not allowed before the loan ends';

    top=[['part',pp],['pre',B?pc:-Infinity],['yr',YY?YY.net:-Infinity]].sort((a,b)=>b[1]-a[1])[0][0];

  const tgtPre=B&&pc>pp,tgt=tgtPre?pc:pp,tgtNm=tgtPre?'pre-close':'monthly part-payment';
  let be=0,bn=0,ye=null;
  if(top==='pre'){
    let lo=X,hi=Math.max(P*(1+r)-E,X+1);
    for(let i=0;i<60;i++){const k=(lo+hi)/2;stdInt-sum(sched(P,r,E+k,0),'i')>=pc?hi=k:lo=k}
    be=Math.ceil(hi);bn=sched(P,r,E+be,0).length;
  }
  if(yOn&&top!=='yr')ye=yrEq(tgt);
  const yLine=(q,nm)=>{
    const h=`<b>Yearly (${q.fq} time${s_(q.fq)} a year):</b> `;
    if(q.none)return h+`no equal yearly amount reaches the ${nm} saving with a ${q.ch}% charge, because the charge cancels too much of the interest saved.`;
    const pl=q.plan,ex=pl.A.filter(a=>a.ex>0),ms=ex.map(a=>a.m),last=ex[ex.length-1],shown=ms.length>8?ms.slice(0,8).join(', ')+' …':lst(ms);
    return h+`pay about ${inr(q.k)} each time, in ${yrMo(q.fq)}`+(q.fq===12||!ms.some(m=>m>12)?'':`, which means loan month${s_(ms.length)} ${shown}`)+
      `. That is ${inr(pl.exs)} extra in all${last&&last.ex<q.k-.5?` (the last payment is only ${inr(last.ex)}, the balance left)`:''}. The loan ends in ${pl.len} months and you save ${inr(pl.net)}`+(q.ch>0?` after ${inr(pl.fees)} of charges (${q.ch}%)`:'')+`, which matches the ${nm} saving.`;
  };
  const yFoot=ye?` The yearly figure uses the ${ye.fq} payment${s_(ye.fq)} a year and ${ye.ch}% charge from Yearly Optimizer, with the same amount in every payment.`:'';
  const g=win?adv('g','check','Better choice: pre-close',`Close in month ${best.m}`,
      `Pay ${inr(best.lump)} (balance ${inr(best.b)} + ${f}% charge ${inr(best.fee)}) after ${best.m} EMIs. You save ${inr(pc)}, which is ${inr(diff)} more than the ${inr(pp)} saved by paying ${inr(X)} extra every month.`,
      `It also ends the loan ${n-best.m} months early, against ${n-nt} months with part-payment.`)
    :adv('g','check','Better choice: part-payment',`Pay ${inr(X)} extra every month`,
      `The loan ends in ${nt} months (${n-nt} sooner) and you save ${inr(pp)}`+(B?`, which is ${inr(diff)} more than the best pre-close option (month ${best.m}: ${inr(pc)} saved after the charge).`:`. Pre-closing is not worthwhile here: ${rows.length?`the ${f}% charge is more than the interest it avoids.`:'the loan ends before closing is allowed.'}`),
      'No part-payment charge is assumed.');
  let k;
  if(top==='pre'){

      ul([`<b>Monthly:</b> pay about ${inr(be)} extra every month. The loan ends in ${bn} months.`].concat(ye?[yLine(ye,'pre-close')]:[])));
  }else if(top==='yr'){

      `Your first part-payment of ${inr(fx.ex)} falls in month ${fx.m}.`+(B?` Pre-closing would need ${inr(best.lump)} at once.`:''),
      'Check that your lender allows this many part-payments a year, and any minimum amount.');
  }else{
    k=adv('a','info','Keep in mind',`${inr(E+X)} every month`,
      `You pay ${inr(X)} more than your EMI for about ${nt} months.`+(B?` Pre-closing would need ${inr(best.lump)} at once.`:'')+(ye?' To get the same saving with fewer payments:':''),
      (auto?`You have not entered an extra amount, so ${inr(X)} (about half your EMI) is used here.`:'Change the extra amount in the Partly Payment view to try another figure.')+yFoot,
      ye?ul([yLine(ye,'monthly part-payment')]):'');
  }
  const R=[
    ['Plan','Pay EMI only',B?`Pay ${best.m} EMIs, then close`:no,`EMI + ${inr(X)} extra`],
    ['Loan ends in',`${n} months`,B?`${best.m} months`:D,`${nt} months`],
    ['Months saved',D,B?`${n-best.m} months`:D,`${n-nt} months`],
    ['Monthly payment',inr(E),B?`${inr(E)} until month ${best.m}`:D,inr(E+X)],

    ['Interest + charges',inr(stdInt),B?inr(best.ci+best.fee):D,inr(ia)],

  const hd=['Compare','Pay EMI only','Pre-close'+(top==='pre'?bd:''),'Part-payment'+(top==='part'?bd:'')],last=['Interest you save',D,B?inr(pc):D,inr(pp)];
  let yt='',kp=kpi('trend','Difference',inr(diff),(win?'Pre-closing':'Part-payment')+' saves more'),gg=g;
  if(YY){
    const y=YY,nm={pre:'pre-close',part:'monthly part-payment',yr:'yearly part-payment'},bv=Math.max(pp,B?pc:-Infinity,y.net),
      hl=top==='pre'?`Close in month ${best.m}`:top==='part'?`Pay ${inr(X)} extra every month`:yrHead(y);

    kp=kpi('repeat','Yearly plan',inr(y.net),`saved; loan ends in ${y.len} months`);
    yt=head('Yearly plan: year-wise summary',`${yrWhat(y)}, in ${yrMo(y.fq)}. Each payment uses its own amount. Years with extra payments are highlighted.`)+yrYearTbl(y)+

  }
  return note(`Based on a ${f}% closing charge after ${Math.max(1,L)} EMIs (set in Pre-Close) and ${inr(X)} extra every month (set in Partly Payment)`+(YY?', plus the year-wise yearly plan (set in Yearly Optimizer)':'')+`. Change them there to update this page.`)+
    (YY?'':yMsg?note('Yearly plan left out: '+yMsg):`<div class="flex flex-wrap gap-3">${GO('yr','Add a yearly plan')}</div>`)+
    g3(kpi('cal',B?`Pre-close (month ${best.m})`:'Pre-close',inr(pc),B?`saved after a ${inr(best.fee)} charge`:no),
      kpi('layers','Part-payment',inr(pp),`saved; loan ends in ${nt} months`),kp)+
    `<div class="grid md:grid-cols-2 gap-3">${gg}${k}</div>`+
    tbl(hd,R.map(x=>`<tr>${td(x)}</tr>`).join('')+`<tr class="best">${td(last)}</tr>`)+yt;
}

/* ---- wiring ---- */
function curFmt(e){
  const el=e.target;if(!el.matches||!el.matches('[data-cur]'))return;
  const left=el.value.slice(0,el.selectionStart).replace(/[^\d.]/g,'').length;
  let t=el.value.replace(/[^\d.]/g,'');const d=t.indexOf('.');
  if(d>=0)t=t.slice(0,d+1)+t.slice(d+1).replace(/\./g,'').slice(0,2);
  const o=gIN((d>=0?t.slice(0,d):t).replace(/^0+(?=\d)/,''))+(d>=0?t.slice(d):'');
  let c=0,i=0;for(;i<o.length&&c<left;i++)if(/[\d.]/.test(o[i]))c++;
  el.value=o;try{el.setSelectionRange(i,i)}catch(x){}
}
document.addEventListener('input',curFmt,true);
const R={normal:vNormal,pre:vPre,part:vPart,yr:vYr,cust:vCust,spec:vSpec};
const on=id=>$('on-'+id).checked,sync=id=>$('b-'+id).classList.toggle('hidden',!on(id));
const nov=h=>`<div class="card text-center py-10"><div class="text-xl font-bold">No value</div><p class="text-sm mt-1" style="color:var(--muted)">${h}</p></div>`,HINT='Fill in the loan details in Normal Calculation first.';
const GO=(id,l)=>`<button type="button" class="lnk" data-go="${id}">${l}</button>`;
const rv=n=>document.querySelector(`input[name=${n}]:checked`).value,sy=()=>{$('yn-w').classList.toggle('hidden',rv('yf')!=='0')};
/* ---- yearly optimizer: one amount box for every payment of every loan year ---- */
let YA={},YDEF=5000,yrSig='';
/* YA[y][j] = amount typed for payment j+1 of loan year y (a box never typed in starts at YDEF) */
const yAmt=(y,j)=>{const r=YA[y];return String(r&&r[j]!==undefined?r[j]:YDEF).replace(/,/g,'').trim()};
const yrN=()=>ST?Math.ceil(ST.n/12):0;
const yrK=()=>{const k=+rv('yf')||v('yn');return Number.isInteger(k)&&k>=1&&k<=12?k:0};
/* loan month in which payment j+1 of loan year y falls when there are fq payments a year */
const slotMo=(y,j,fq)=>(y-1)*12+Math.floor(j*12/fq)+1;
/* every box as a number: xs[y-1][j]. A box that cannot be read counts as 0 and is listed in bad */
function yrXs(fq){
  const xs=[],bad=[],yrs=yrN();
  for(let y=1;y<=yrs;y++){const row=[];for(let j=0;j<fq;j++){const a=yAmt(y,j),t=a===''?0:Number(a);if(isFinite(t)&&t>=0)row.push(t);else{row.push(0);bad.push({y,j})}}xs.push(row)}
  return{xs,bad};
}
function yrFields(force){
  const g=$('yy-g'),q=$('yy-q');if(!g)return;
  const yrs=yrN(),k=yrK(),sig=yrs+'|'+k+'|'+(ST?ST.n:0);
  if(force||sig!==yrSig){
    yrSig=sig;
    if(!yrs){q.innerHTML='';g.innerHTML='<p class="text-sm" style="color:var(--muted)">Fill in the loan details first. The payment boxes will appear for every loan year.</p>';yrNote();return}
    q.innerHTML=[1,2,3].map(x=>`<button type="button" class="qf" data-qf="${x}">${x}× EMI</button>`).join('')+`<button type="button" class="qf" data-qf="f">Copy Year 1 to all</button><button type="button" class="qf" data-qf="c">Clear all</button>`;
    if(!k){g.innerHTML='<p class="text-sm" style="color:var(--muted)">Choose how many times a year you will pay (1 to 12) to see the payment boxes.</p>';yrNote();return}
    g.innerHTML=Array.from({length:yrs},(_,i)=>{const y=i+1,a=i*12+1,z=Math.min(y*12,ST.n);
      return `<div class="yf yb" id="yf${y}"><div class="ybh"><b>Year ${y}</b> <small>(${a===z?'month '+a:'months '+a+'–'+z})</small></div><small class="yo" id="yo${y}"></small><div class="ysg">`+
        Array.from({length:k},(_,j)=>`<div class="ys" id="ys${y}_${j}">${cfld(`yy${y}_${j}`,`Year ${y} - Payment ${j+1} <small>(month ${slotMo(y,j,k)})</small>`,yAmt(y,j))}<small class="yo"></small></div>`).join('')+`</div></div>`}).join('');
  }
  yrMark();
}
/* grey out the payment boxes that fall after the loan has already closed (they are not used) */
function yrMark(){
  const yrs=yrN(),k=yrK();if(!yrs)return;
  if(!k)return yrNote();
  const p=yrPlan(),lim=p.A?p.len:ST.n,cl=Math.ceil(lim/12);
  for(let y=1;y<=yrs;y++){
    const w=$('yf'+y);if(!w)continue;
    const offs=Array.from({length:k},(_,j)=>slotMo(y,j,k)>lim),live=offs.filter(x=>!x).length;
    offs.forEach((off,j)=>{
      const s=$(`ys${y}_${j}`),i=$(`yy${y}_${j}`);if(!s||!i)return;
      s.classList.toggle('off',off);i.disabled=off;
      s.querySelector('.yo').textContent=off&&live?'Not needed':'';
    });
    w.classList.toggle('off',!live);
    $('yo'+y).textContent=live?'':`Not needed: the loan ends in Year ${cl}`;
  }
  yrNote();
}
/* note below the payment boxes (above "Prepayment charge"): shown when the amount typed for the payment that closes the loan is more than the balance needs */
function yrNote(){
  const el=$('yy-note');if(!el)return;
  let h='';
  try{
    const yrs=yrN(),fq=+rv('yf')||v('yn');
    if(yrs&&Number.isInteger(fq)&&fq>=1&&fq<=12){
      const {xs}=yrXs(fq),p=yrSim(xs,fq,0),cy=Math.ceil(p.len/12),row=xs[cy-1]||[],pays=p.A.filter(a=>a.y===cy&&a.ex>0);
      if(row.some(x=>x>0)){
        if(!pays.length)h=`Note: For Year ${cy}, no extra payment is required. The regular EMIs already clear the loan balance.`;
        else{
          const last=pays[pays.length-1],amt=row[last.sl-1]||0;
          if(last.c<=.005&&amt-last.ex>=.5)h=`Note: For Year ${cy} - Payment ${last.sl} (month ${last.m}), only ${inr(last.ex)} is required to fully pay off the loan balance.`;
        }
      }
    }
  }catch(e){h=''}
  el.innerHTML=h?ic('info','w-4 h-4')+`<span>${h}</span>`:'';
}
$('yy-w').addEventListener('input',e=>{
  const m=/^yy(\d+)_(\d+)$/.exec(e.target.id);if(!m)return;
  (YA[m[1]]=YA[m[1]]||[])[m[2]]=e.target.value.replace(/,/g,'');render();
});
$('yy-w').addEventListener('click',e=>{
  const bt=e.target.closest('[data-qf]');if(!bt||!ST)return;
  const yrs=yrN(),q=bt.dataset.qf,first=Array.from({length:12},(_,j)=>yAmt(1,j));
  /* all 12 possible slots are filled, so the amounts are still there if the number of payments a year is changed later */
  for(let y=1;y<=yrs;y++)YA[y]=Array.from({length:12},(_,j)=>q==='c'?'':q==='f'?first[j]:String(+(+q*ST.E).toFixed(2)));
  yrFields(true);render();
});
/* one simulation of the yearly plan. xs[y-1][j] = amount of payment j+1 in loan year y.
   X = optional extra paid with every EMI (0 here; the Pre-Close view uses it) */
function yrSim(xs,fq,ch,X=0){
  const {P,E,r,int:si}=ST,MS=Array.from({length:fq},(_,j)=>Math.floor(j*12/fq)+1),A=[];let b=P;
  for(let m=1;b>.005&&m<=1200;m++){
    const i=b*r,yi=Math.floor((m-1)/12),mi=(m-1)%12+1;let p=E+X-i,pay=E,mx=X;
    if(p>=b-.005){p=b;const t=b+i;if(X>0){pay=Math.min(E,t);mx=t-pay}else{pay=t;mx=0}}
    b-=p;let ex=0,fee=0,sl=0;
    const j=MS.indexOf(mi),x=j>=0?((xs[yi]||[])[j]||0):0;
    if(x>0&&b>.005){ex=Math.min(x,b);fee=ex*ch/100;b-=ex;sl=j+1}
    b=Math.max(0,b);A.push({m,y:yi+1,pay,mx,ex,fee,sl,i,p,c:b,sp:P-b});
  }
  const ia=sum(A,'i'),fees=sum(A,'fee');
  return{A,len:A.length,ia,fees,exs:sum(A,'ex'),cnt:A.filter(a=>a.ex>0).length,gross:si-ia,net:si-ia-fees,xs,fq,ch,MS,si};
}
/* the Yearly Optimizer settings as numbers (shared by the Yearly, Special and Pre-Close views) */
function yrInputs(){
  const fq=+rv('yf')||v('yn'),ch=v('ypc');
  if(!(Number.isInteger(fq)&&fq>=1&&fq<=12))return{err:'Enter a whole number of part-payments per year, from 1 to 12.'};
  if(!isFinite(ch)||ch<0||ch>100)return{err:'Please enter a valid prepayment charge between 0 and 100%.'};
  return Object.assign({fq,ch},yrXs(fq));
}
function yrPlan(){
  const q=yrInputs();if(q.err)return{err:q.err};
  const {fq,ch,xs,bad}=q,p=yrSim(xs,fq,ch),hit=bad.find(b=>slotMo(b.y,b.j,fq)<=p.len);
  if(hit)return{err:`Please enter a valid amount for Year ${hit.y} - Payment ${hit.j+1}.`};
  if(!xs.some(r=>r.some(x=>x>0)))return{none:'Enter an extra amount for at least one payment above to see the result.'};
  if(!p.cnt)return{none:'The loan ends before any of these extra payments is due. Enter an amount for an earlier payment.'};
  return Object.assign(p,{yrs:yrN()});
}
/* plain-words descriptions of a yearly plan (only the payments that fall while the loan is still running) */
const s_=n=>n>1?'s':'',
  yrSlots=p=>{const o=[];p.xs.forEach((r,yi)=>r.forEach((x,j)=>{if(slotMo(yi+1,j,p.fq)<=p.len)o.push(x)}));return o},
  yrU=p=>[...new Set(yrSlots(p).map(x=>+x.toFixed(2)))];
function yrWhat(p){
  const u=yrSlots(p),{fq}=p;
  if(yrU(p).length===1)return `${inr(u[0])} each time × ${fq} = ${inr(fq*u[0])} a year`;
  const pos=u.filter(x=>x>0),z=u.length-pos.length;
  if(!pos.length)return 'no extra payments';
  const lo=Math.min(...pos),hi=Math.max(...pos);
  return lo===hi?`${inr(lo)} each time, but only for ${pos.length} of ${u.length} payments`:`individual amounts of ${inr(lo)} to ${inr(hi)} each time`+(z?`, with no extra in ${z} payment${s_(z)}`:'');
}
const yrHead=p=>`Pay ${yrU(p).length===1?inr(yrSlots(p)[0]):'individual amounts'} ${p.fq} time${s_(p.fq)} a year`,
  yrLab=p=>`${yrU(p).length===1?inr(yrSlots(p)[0]):'Slot-wise'} × ${p.fq} a year`,
  lst=a=>a.length>1?a.slice(0,-1).join(', ')+' and '+a[a.length-1]:''+a[0],
  yrMo=fq=>fq===12?'every month':`month${s_(fq)} ${lst(Array.from({length:fq},(_,j)=>Math.floor(j*12/fq)+1))} of each loan year`,
  /* the extra payments of one year as text, equal neighbours grouped: "₹5,000 × 2 + ₹8,000" */
  yrAmts=a=>{const o=[];a.forEach(z=>{const t=inr(z.ex),l=o[o.length-1];l&&l[0]===t?l[1]++:o.push([t,1])});return o.map(([t,c])=>c>1?`${t} × ${c}`:t).join(' + ')};
const yrTable=p=>{const {A,exs,fees,ia}=p;return tbl(['Month','Regular EMI','Extra payment','Charge','Interest','Principal','Balance left','Settled amount'],
  A.map(x=>`<tr class="${x.ex?'best':''}">`+td([x.m+(x.ex?` <span class="bdg g">Payment ${x.sl}</span>`:''),inr(x.pay),x.ex?inr(x.ex):'—',x.ex?inr(x.fee):'—',inr(x.i),inr(x.p),inr(x.c),inr(x.sp)],7)+'</tr>').join(''),
  `<tfoot><tr>${td(['Total',inr(sum(A,'pay')),inr(exs),inr(fees),inr(ia),inr(sum(A,'p')),'',''])}</tr></tfoot>`,7)};
/* year-wise summary: one row for each loan year the loan runs; the amounts are the individual payments of that year */
function yrYearTbl(p){
  const {A,len}=p;let tx=0,tf=0,ti=0;
  const rows=Array.from({length:Math.ceil(len/12)},(_,i)=>{
    const y=i+1,a=A.filter(z=>z.y===y),pd=a.filter(z=>z.ex>0),ex=sum(a,'ex'),fee=sum(a,'fee'),it=sum(a,'i'),c=pd.length;tx+=ex;tf+=fee;ti+=it;
    return`<tr class="${ex?'best':''}">`+td([`Year ${y}`,a[0].m===a[a.length-1].m?`${a[0].m}`:`${a[0].m}–${a[a.length-1].m}`,c?yrAmts(pd):'—',c?String(c):'—',ex?inr(ex):'—',ex?inr(fee):'—',inr(it),inr(a[a.length-1].c)],4)+'</tr>';
  }).join('');
  return tbl(['Loan year','Months','Payment amounts','Payments','Extra paid','Charge','Interest','Balance at year end'],rows,
    `<tfoot><tr>${td(['Total','','','',inr(tx),inr(tf),inr(ti),''])}</tr></tfoot>`,4);
}
function vYr(){
  const p=yrPlan(),{n}=ST;
  if(p.err)return msg(p.err);if(p.none)return note(p.none);
  const {len,ia,fees,exs,cnt,gross,net,fq,ch,si}=p,pl=yrWhat(p);
  return (net>0?adv('g','check','Worth it',`You save ${inr(net)}`,`Paying ${pl}, in ${yrMo(fq)}, ends the loan ${n-len} months sooner.`,`Charges of ${inr(fees)} are already taken off the interest saved.`)
    :adv('r','alert','Not worth it','Charges cost more than they save',`The ${ch}% charge adds up to ${inr(fees)}, which is not less than the ${inr(gross)} of interest avoided.`,'Keep paying your regular EMI, or check whether the charge can be waived.'))+
    `<div class="grid grid-cols-2 lg:grid-cols-3 gap-3">`+
    kpi('clock','New loan duration',len+' months',`instead of ${n} months`)+
    kpi('cal','Time saved',(n-len)+' months',`${((n-len)/12).toFixed(1)} years sooner`)+
    kpi('alert','Total charges paid',inr(fees),`${ch}% on ${inr(exs)} prepaid`)+
    kpi('trend','Gross interest saved',inr(gross),`${inr(si)} down to ${inr(ia)}`)+
    kpi('check','Net interest saved',sn(net),'after all charges')+
    kpi('layers','Part-payments made',cnt+(cnt===1?' time':' times'),`${inr(exs)} extra in total`)+`</div>`+
    head('Year-wise plan',`Each of the ${fq} payment${s_(fq)} a year uses its own amount. Years with extra payments are highlighted.`)+yrYearTbl(p)+
    head('Month-by-month schedule',`Months with an extra part-payment are highlighted. The ${fq} payment${s_(fq)} a year are spread evenly, starting early in each loan year so the savings last longer. ${SET}`)+yrTable(p)+dwise('yr',p.A);
}
/* smallest equal amount per payment (yearly, fq times a year) whose net saving matches `target` */
function yrEq(target){
  const fq=+rv('yf')||v('yn'),ch=v('ypc');
  if(!(Number.isInteger(fq)&&fq>=1&&fq<=12)||!isFinite(ch)||ch<0||ch>100)return null;
  const {P}=ST,yrs=yrN(),sim=k=>yrSim(Array.from({length:yrs},()=>Array(fq).fill(k)),fq,ch),tol=target-.005;
  let lo=0,hi=-1,prev=0;
  for(let st=1;st<=120;st++){const k=P*st/120;if(sim(k).net>=tol){hi=k;lo=prev;break}prev=k}
  if(hi<0)return{fq,ch,none:true};
  for(let i=0;i<50;i++){const m=(lo+hi)/2;sim(m).net>=tol?hi=m:lo=m}
  let k=Math.max(1,Math.ceil(hi)),plan=sim(k);
  for(let t=0;t<200&&plan.net<tol;t++){k++;plan=sim(k)}
  return plan.net<tol?{fq,ch,none:true}:{fq,ch,k,plan};
}
$('dy').addEventListener('keydown',e=>{if(['e','E','+','-','.',','].includes(e.key))e.preventDefault()});

    `<div class="text-2xl font-extrabold" style="color:var(--acc)">${(+y*12).toLocaleString('en-IN')} ${+y*12===1?'month':'months'}</div><p class="text-sm" style="color:var(--muted)">${(+y).toLocaleString('en-IN')} ${+y===1?'year':'years'} × 12 = ${(+y*12).toLocaleString('en-IN')} months</p>`;

function rateBar(){

}
const IM=$('im'),IB=$('ib'),IX=$('im-x'),BAR=$('im-bar');let imT=0;

IX.onclick=closeIM;$('im-bg').onclick=closeIM;
document.addEventListener('keydown',e=>{if(!IM.classList.contains('open'))return;if(e.key==='Escape')closeIM();else if(e.key==='Tab'){e.preventDefault();IX.focus()}});
/* keep the two Pre-Close switches in step with the Partly Payment and Yearly Optimizer settings */

const dim=()=>document.querySelectorAll('.res').forEach(e=>e.classList.add('opacity-40','pointer-events-none')),undim=()=>document.querySelectorAll('.res').forEach(e=>e.classList.remove('opacity-40','pointer-events-none'));
function bad(m){$('err').textContent=m+(ST?' Showing your last valid result.':'');ST&&dim()}
function run(){
  $('err').textContent='';
  if(['base','prin','emi','ten'].some(id=>$(id).value.trim()===''))return ST=null,undim(),render(),false;
  const P=v('prin'),E=v('emi'),n=Math.round(v('ten'));
  if([v('base'),P,E,v('ten')].some(x=>!isFinite(x)||x<0)||!(P>0)||!(E>0)||!(n>0))return bad('Please enter valid positive numbers.');
  if(E*n<=P)return bad('EMI × tenure must be greater than the loan amount in the agreement.');
  const r=solve(P,E,n),S=sched(P,r,E,n);
  ST={base:v('base'),P,E,n,r,S,paid:sum(S,'paid'),int:sum(S,'i')};
  undim();render();return true;
}

  ['base','prin','emi','ten','extra','cy','cm','fc','lock','dm','dy','da','yn','ypc'].forEach(id=>{const e=$(id);e.value='';e.defaultValue=''});

};
